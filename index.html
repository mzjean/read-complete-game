<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DET Practice App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Welcome to DET Practice</h1>
  <p>Select a practice mode:</p>
  <div class="button-section">
    <button class="game-button" onclick="location.href='fill-in-the-blanks/index.html'">Fill in the Blanks</button>
    <button class="game-button" onclick="location.href='read-and-complete/index.html'">Read and Complete</button>
  </div>
  <div class="button-section" style="margin-top: 12px;">
    <button class="game-button" style="background-color: var(--success-color);" onclick="location.href='my-results.html'">My Results</button>
    <button class="game-button" style="background-color: var(--warning-color); color: #333;" onclick="location.href='leaderboard.html'">Leaderboard</button>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
  <script>requireAuth();</script>
</body>
</html>
