<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DET Practice - Leaderboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .leaderboard-container {
      max-width: 800px;
      width: 95%;
      margin: 20px auto;
    }
    .podium {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 12px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }
    .podium-item {
      text-align: center;
      padding: 16px 20px;
      border-radius: 12px;
      background: #fff;
      border: 2px solid #ddd;
      box-shadow: 0 4px 8px rgba(0,0,0,0.08);
      min-width: 120px;
    }
    .podium-item.gold {
      border-color: #ffd700;
      background: linear-gradient(135deg, #fffdf0, #fff8dc);
      order: 2;
      transform: scale(1.08);
    }
    .podium-item.silver {
      border-color: #c0c0c0;
      background: linear-gradient(135deg, #fafafa, #f0f0f0);
      order: 1;
    }
    .podium-item.bronze {
      border-color: #cd7f32;
      background: linear-gradient(135deg, #fdf5ee, #faebd7);
      order: 3;
    }
    .podium-rank {
      font-size: 1.8rem;
      font-weight: bold;
    }
    .podium-name {
      font-size: 1rem;
      font-weight: bold;
      margin: 6px 0;
      word-break: break-word;
    }
    .podium-score {
      font-size: 1.3rem;
      color: var(--primary-color);
      font-weight: bold;
    }
    .podium-games {
      font-size: 0.8rem;
      color: #888;
    }
    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .leaderboard-table th {
      background: var(--primary-color);
      color: #fff;
      padding: 12px;
      font-size: 0.95rem;
    }
    .leaderboard-table td {
      padding: 10px 12px;
      border-bottom: 1px solid #eee;
      text-align: center;
    }
    .leaderboard-table tr:hover {
      background: #f5f5f5;
    }
    .leaderboard-table .rank-col {
      width: 50px;
      font-weight: bold;
    }
    .leaderboard-table .name-col {
      text-align: left;
    }
    .current-user-row {
      background: #e6f7ff !important;
      font-weight: bold;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #888;
    }
    .empty-state h2 {
      color: var(--primary-color);
    }
    .loading-spinner {
      text-align: center;
      padding: 40px;
      font-size: 1.1rem;
      color: #888;
    }
  </style>
</head>
<body>
  <h1>Leaderboard</h1>

  <div class="leaderboard-container">
    <div id="podium" class="podium"></div>
    <div id="leaderboard-content">
      <div class="loading-spinner">Loading leaderboard...</div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>

  <script>
    requireAuth();

    auth.onAuthStateChanged(async (user) => {
      if (user) {
        const entries = await getLeaderboard();
        renderLeaderboard(entries, user.uid);
      }
    });

    function renderLeaderboard(entries, currentUid) {
      const podiumEl = document.getElementById("podium");
      const contentEl = document.getElementById("leaderboard-content");

      if (entries.length === 0) {
        podiumEl.innerHTML = "";
        contentEl.innerHTML = `
          <div class="empty-state">
            <h2>No scores yet!</h2>
            <p>Be the first on the leaderboard. Go play a game!</p>
            <a href="index.html" class="game-button" style="display:inline-block;margin-top:16px;text-decoration:none;">Play Now</a>
          </div>`;
        return;
      }

      // Podium (top 3)
      const medals = ["gold", "silver", "bronze"];
      const rankEmoji = ["\u{1F947}", "\u{1F948}", "\u{1F949}"];
      const top3 = entries.slice(0, 3);

      podiumEl.innerHTML = top3.map((e, i) => `
        <div class="podium-item ${medals[i]}">
          <div class="podium-rank">${rankEmoji[i]}</div>
          <div class="podium-name">${sanitizeForBar(e.displayName)}</div>
          <div class="podium-score">${e.overallAvg}%</div>
          <div class="podium-games">${e.totalGames} game${e.totalGames === 1 ? "" : "s"}</div>
        </div>
      `).join("");

      // Full table
      contentEl.innerHTML = `
        <table class="leaderboard-table">
          <thead>
            <tr>
              <th class="rank-col">#</th>
              <th class="name-col">Student</th>
              <th>Fill in Blanks Avg</th>
              <th>Read & Complete Avg</th>
              <th>Overall Avg</th>
              <th>Games</th>
            </tr>
          </thead>
          <tbody>
            ${entries.map((e, i) => `
              <tr class="${e.userId === currentUid ? "current-user-row" : ""}">
                <td class="rank-col">${i + 1}</td>
                <td class="name-col">${sanitizeForBar(e.displayName)}</td>
                <td>${e.fitbAvg || 0}%</td>
                <td>${e.readCompleteAvg || 0}%</td>
                <td><strong>${e.overallAvg}%</strong></td>
                <td>${e.totalGames}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>`;
    }
  </script>
</body>
</html>
